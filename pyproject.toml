[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hrd-ai-service"
version = "0.1.0"
description = "HRD Intelligence AI service: document ingestion and RAG chat (LangChain + LangGraph)"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "pgvector>=0.3.6",
    "alembic>=1.13",
    # LangChain / LangGraph
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-text-splitters>=0.3",
    "langgraph>=0.2",
    "tokenizers>=0.19",
    # Document parsing
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "charset-normalizer>=3.3",
    "pillow>=10",
    "numpy>=1.26",
]

[project.optional-dependencies]
ocr-paddle = ["paddlepaddle>=3.0", "paddleocr>=3.0"]
ocr-tesseract = ["pytesseract>=0.3.10"]
eureka = ["py-eureka-client>=0.11"]
ui = ["streamlit>=1.38"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
markers = ["integration: needs the docker-compose Postgres (pgvector)"]
